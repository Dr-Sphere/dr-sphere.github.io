    function runSkullReveal(onDone) {
      fitCanvas();
      const W = canvas.width, H = canvas.height;
      const ROWS = SKULL.length, COLS = SKULL[0].length;
      const SKULL_SIZE = Math.min(W, H) * 0.72;
      const CELL = SKULL_SIZE / Math.max(ROWS, COLS);
      const cx = W / 2, cy = H / 2;
      const skullLeft = cx - (COLS * CELL) / 2;
      const skullTop  = cy - (ROWS * CELL) / 2;
 
      const pixels = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!SKULL[r][c]) continue;
          const isTeeth = (r >= 27 && r <= 28) || (r >= 31 && r <= 32);
          const isCrack = (r === 6 && (c === 12 || c === 21)) || (r === 7 && (c === 11 || c === 20)) || (r === 8 && (c === 15 || c === 16));
          let pr, pg, pb;
          if (isTeeth) {
            pr = 220 + Math.floor(Math.random()*35); pg = 200 + Math.floor(Math.random()*30); pb = 170 + Math.floor(Math.random()*30);
          } else if (isCrack) {
            pr = 40 + Math.floor(Math.random()*20); pg = 30; pb = 20;
          } else {
            const shade = 0.55 + Math.random() * 0.45;
            pr = Math.floor(255 * shade);
            pg = Math.floor((104 + Math.random()*40) * shade);
            pb = Math.floor((Math.random()*20) * shade);
          }
          pixels.push({
            tx: skullLeft + c * CELL, ty: skullTop + r * CELL,
            x: Math.random() * W, y: Math.random() * H,
            size: CELL, pr, pg, pb,
          });
        }
      }
 
      const PHASE1 = 1600, PHASE2 = 700, PHASE3 = 500;
      const TOTAL = PHASE1 + PHASE2 + PHASE3;
      const start = performance.now();
      let animId;
 
      function frame(now) {
        const elapsed = now - start;
        ctx.fillStyle = '#080808';
        ctx.fillRect(0, 0, W, H);
 
        if (elapsed < PHASE1) {
          const t = elapsed / PHASE1;
          pixels.forEach(p => {
            const ease = 1 - Math.pow(1 - t, 3);

        H = screenH;

      } else {
        W = screenW;
        H = Math.round(W * ROWS / COLS);

      skullCanvas.width = W;

    const SECRET = 'DrSphere$Vault#2026!xK9mP';
 
    async function deriveKey(secret) {
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'PBKDF2' }, false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode('cipher_salt_v1'), iterations: 100000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
 
    const bufToHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    function hexToBuf(hex) { const b = new Uint8Array(hex.length/2); for (let i=0;i<hex.length;i+=2) b[i/2]=parseInt(hex.substr(i,2),16); return b; }
 
    async function encryptMsg(pt) {
      const key = await deriveKey(SECRET);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(pt));
      return bufToHex(iv) + ':' + bufToHex(ct);
    }
 
    async function decryptMsg(enc) {
      const [ivH, ctH] = enc.split(':');
      if (!ivH || !ctH) throw new Error('Invalid format');
      const key = await deriveKey(SECRET);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: hexToBuf(ivH) }, key, hexToBuf(ctH));
      return new TextDecoder().decode(pt);
    }

      // Pause the timer
      clearInterval(idleInterval);
      idleInterval = null;

      try { typeOutput(mode === 'encrypt' ? await encryptMsg(input) : await decryptMsg(input)); }
      catch(e) { typeOutput('// ERROR: ' + (e.message || 'failed')); }

      document.getElementById('btnLabel').textContent = mode === 'encrypt' ? '' : '';
      btn.disabled = false;

      // Resume the timer from where it left off
      if (revealed) {
        idleInterval = setInterval(() => {
          idleSecondsLeft--;
          const brightness = Math.max(0, idleSecondsLeft / IDLE_TIMEOUT);
          drawSkullTimer(brightness);
          skullCanvas.style.opacity = String(0.18 * brightness + 0.02);
          if (idleSecondsLeft <= 0) {
            clearInterval(idleInterval);
            if (revealed && !transitioning) { transitioning = true; triggerClose(); }
          }
        }, 1000);
      }
    }
 
    function typeOutput(text) {
      const box = document.getElementById('outputBox'), ph = document.getElementById('outputPlaceholder'), ot = document.getElementById('outputText');
      ph.style.display = 'none'; ot.style.display = 'inline'; ot.textContent = '';
      box.classList.add('has-output'); box.classList.remove('copied');
      const cur = document.createElement('span'); cur.className = 'cursor-blink'; ot.after(cur);
      let i = 0;
      const spd = Math.max(8, Math.min(30, 1500 / text.length));
      const iv = setInterval(() => { ot.textContent += text[i++]; if (i >= text.length) { clearInterval(iv); cur.remove(); } }, spd);
    }
 
    function clearOutput() {
      const box = document.getElementById('outputBox'), ph = document.getElementById('outputPlaceholder'), ot = document.getElementById('outputText');
      ph.style.display = 'inline'; ot.style.display = 'none'; ot.textContent = '';
      box.classList.remove('has-output', 'copied');
      box.querySelectorAll('.cursor-blink').forEach(c => c.remove());
    }
 
    function copyOutput() {
      const text = document.getElementById('outputText').textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const box = document.getElementById('outputBox');
        box.classList.add('copied');
        setTimeout(() => box.classList.remove('copied'), 1000);
      });
    }
 
    document.getElementById('inputBox').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) execute();
    });
  </script>
</body>
